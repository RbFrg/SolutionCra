[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Crates du dépôt
domain = { path = "crates/domain" }
application = { path = "crates/application" }
adapter-http = { path = "crates/adapter-http" }
adapter-memory = { path = "crates/adapter-memory" }
adapter-store = { path = "crates/adapter-store" }
adapter-export = { path = "crates/adapter-export" }
test-support = { path = "crates/test-support" }

# Transverse
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
unicode-normalization = "0.1"

# Web
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }

# Persistance
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Exports
docx-rs = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"

# Tests
http-body-util = "0.1"
insta = { version = "1", features = ["json"] }
proptest = "1"
rstest = "0.25"
pretty_assertions = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
